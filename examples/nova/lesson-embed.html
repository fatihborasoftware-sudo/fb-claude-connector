<!-- Nova Güzellik — interactive mockup viewer (paste into the lesson's Custom HTML box) -->
<div class="nvx" id="nvx">
  <style>
    .nvx{--ink:#2A2024;--clay:#B0583F;--line:#EAD8CF;font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);margin:32px 0}
    .nvx *{box-sizing:border-box}
    .nvx-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
    .nvx-head h3{margin:0;font-size:22px;line-height:1.25}
    .nvx-head p{margin:4px 0 0;color:#5A4B4F;font-size:14px}
    .nvx-dev{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .nvx-dev button{border:0;background:#fff;color:#5A4B4F;font:600 13px/1 inherit;padding:10px 14px;cursor:pointer}
    .nvx-dev button[aria-pressed="true"]{background:var(--ink);color:#fff}
    .nvx-win{background:#141413;border-radius:20px;padding:12px;box-shadow:0 30px 60px -30px rgba(20,20,19,.5)}
    .nvx-bar{display:flex;align-items:center;gap:10px;padding:2px 6px 10px;flex-wrap:wrap}
    .nvx-dots{display:flex;gap:6px}.nvx-dots i{width:10px;height:10px;border-radius:50%;background:#3D3D3A;display:block}
    .nvx-url{flex:1;min-width:160px;background:#2A2A28;color:#C9C7BE;border-radius:8px;padding:7px 12px;font:12px/1.3 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .nvx-open{color:#E8A87C!important;font:600 12px/1 inherit;text-decoration:none;white-space:nowrap}
    .nvx-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 4px 10px;scrollbar-width:thin}
    .nvx-tabs button{flex:0 0 auto;border:0;border-radius:999px;background:#2A2A28;color:#C9C7BE;font:600 13px/1 inherit;padding:9px 14px;cursor:pointer}
    .nvx-tabs button[aria-selected="true"]{background:var(--clay);color:#fff}
    .nvx-tabs button:focus-visible,.nvx-dev button:focus-visible{outline:2px solid #E8A87C;outline-offset:2px}
    .nvx-stage{background:#FAF7F4;border-radius:12px;overflow:hidden;display:flex;justify-content:center}
    .nvx-stage iframe{display:block;width:100%;height:760px;border:0;background:#FAF7F4;transition:width .25s}
    .nvx.is-mobile .nvx-stage{background:#2A2A28;padding:18px 0}
    .nvx.is-mobile .nvx-stage iframe{width:390px;max-width:100%;height:760px;border-radius:24px}
    .nvx-msg{padding:60px 20px;text-align:center;color:#5A4B4F}
    .nvx-foot{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:14px}
    .nvx-foot a{color:var(--clay);font-weight:700;text-decoration:none}
    @media (max-width:640px){.nvx-stage iframe{height:620px}.nvx-win{padding:8px;border-radius:14px}}
  </style>

  <div class="nvx-head">
    <div>
      <h3>Nova Güzellik — mockup'ı gez</h3>
      <p>Claude'un tasarladığı 8 sayfalık site. Sayfalar arasında gezin, linklere tıklayın, mobil görünüme geçin.</p>
    </div>
    <div class="nvx-dev" role="group" aria-label="Görünüm">
      <button type="button" data-dev="desktop" aria-pressed="true">Masaüstü</button>
      <button type="button" data-dev="mobile" aria-pressed="false">Mobil</button>
    </div>
  </div>

  <div class="nvx-win">
    <div class="nvx-bar">
      <span class="nvx-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="nvx-url" id="nvx-url">nova-guzellik.com/</span>
      <a class="nvx-open" id="nvx-open" href="https://github.com/fatihborasoftware-sudo/fb-claude-connector/tree/main/examples/nova/mockup" target="_blank" rel="noopener">Yeni sekmede aç ↗</a>
    </div>
    <div class="nvx-tabs" role="tablist" aria-label="Sayfalar" id="nvx-tabs"></div>
    <div class="nvx-stage"><iframe id="nvx-frame" title="Nova Güzellik mockup" loading="lazy"></iframe></div>
  </div>

  <div class="nvx-foot">
    <a href="https://github.com/fatihborasoftware-sudo/fb-claude-connector/tree/main/examples/nova" target="_blank" rel="noopener">Mockup, promptlar ve build kit (GitHub) ↗</a>
    <a href="https://github.com/fatihborasoftware-sudo/fb-claude-connector/releases/latest" target="_blank" rel="noopener">Claude Connector'ı indir ↗</a>
  </div>

  <script>
  (function(){
    var root=document.getElementById('nvx'); if(!root||root.dataset.ready) return; root.dataset.ready='1';
    var PAGES=[['index','Anasayfa'],['tedaviler','Tedaviler'],['fiyatlar','Fiyatlar'],['oncesi-ve-sonrasi','Öncesi & Sonrası'],['hakkimizda','Hakkımızda'],['sik-sorulan-sorular','SSS'],['blog','Blog'],['iletisim','İletişim']];
    var SRC=['https://cdn.jsdelivr.net/gh/fatihborasoftware-sudo/fb-claude-connector@main/examples/nova/mockup/','https://raw.githubusercontent.com/fatihborasoftware-sudo/fb-claude-connector/main/examples/nova/mockup/'];
    var cache={}, frame=document.getElementById('nvx-frame'), tabs=document.getElementById('nvx-tabs'), url=document.getElementById('nvx-url'), open=document.getElementById('nvx-open'), cur='';
    function get(p){ if(cache[p]) return Promise.resolve(cache[p]);
      var i=0; function next(){ if(i>=SRC.length) return Promise.reject(); return fetch(SRC[i++]+p+'.html').then(function(r){ if(!r.ok) throw 0; return r.text(); }).catch(next); }
      return next().then(function(t){ cache[p]=t; return t; }); }
    function show(p){ if(p===cur) return; cur=p;
      [].forEach.call(tabs.children,function(b){ b.setAttribute('aria-selected', b.dataset.p===p?'true':'false'); });
      url.textContent='nova-guzellik.com/'+(p==='index'?'':p+'/');
      open.href='https://github.com/fatihborasoftware-sudo/fb-claude-connector/blob/main/examples/nova/mockup/'+p+'.html';
      get(p).then(function(html){ frame.srcdoc=html; }, function(){ frame.srcdoc='<p class="nvx-msg" style="font-family:sans-serif;padding:60px 20px;text-align:center">Sayfa yüklenemedi. GitHub\'dan açabilirsiniz.</p>'; }); }
    frame.addEventListener('load',function(){ var d; try{ d=frame.contentDocument; }catch(e){ return; } if(!d) return;
      d.addEventListener('click',function(e){ var a=e.target.closest&&e.target.closest('a'); if(!a) return; var h=a.getAttribute('href')||'';
        var m=h.match(/^([\w-]+)\.html(#.*)?$/); if(m){ e.preventDefault(); show(m[1]); return; }
        if(/^https?:/.test(h)){ e.preventDefault(); window.open(h,'_blank','noopener'); } else if(h.charAt(0)!=='#'){ e.preventDefault(); } });
      d.addEventListener('submit',function(e){ e.preventDefault(); }); });
    open.addEventListener('click',function(e){ if(!cache[cur]||!window.Blob) return; e.preventDefault(); window.open(URL.createObjectURL(new Blob([cache[cur]],{type:'text/html'})),'_blank'); });
    PAGES.forEach(function(x){ var b=document.createElement('button'); b.type='button'; b.setAttribute('role','tab'); b.dataset.p=x[0]; b.textContent=x[1]; b.addEventListener('click',function(){ show(x[0]); }); tabs.appendChild(b); });
    [].forEach.call(root.querySelectorAll('.nvx-dev button'),function(b){ b.addEventListener('click',function(){ var m=b.dataset.dev==='mobile'; root.classList.toggle('is-mobile',m); [].forEach.call(root.querySelectorAll('.nvx-dev button'),function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); }); }); });
    show('index');
  })();
  </script>
</div>
